name: Multi-Platform Binary Compilation (.exe, .dmg, .AppImage, .apk)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop Executables (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Auto-Initialize Tauri Configs if Missing
        shell: bash
        run: |
          if [ ! -f "src-tauri/tauri.conf.json" ]; then
            echo "src-tauri/tauri.conf.json missing, initializing default configuration..."
            mkdir -p src-tauri
            cat << 'EOF' > src-tauri/tauri.conf.json
{
  "build": {
    "beforeBuildCommand": "npm run build",
    "beforeDevCommand": "npm run dev",
    "devPath": "http://localhost:1420",
    "distDir": "../dist"
  },
  "package": {
    "productName": "Meta-AI-Builder",
    "version": "1.0.0"
  },
  "tauri": {
    "allowlist": { "all": true },
    "bundle": {
      "active": true,
      "targets": "all",
      "identifier": "com.metaai.builder",
      "icon": ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icon.icns", "icon.ico"]
    },
    "security": { "csp": null },
    "windows": [{ "title": "Meta-AI Web Builder", "width": 1280, "height": 800 }]
  }
}
EOF
          fi

      - name: Build Desktop Binaries
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Meta-AI Builder v__VERSION__'
          releaseBody: 'Automated desktop build executable'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'ubuntu-latest' && '--target x86_64-unknown-linux-gnu' || '' }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meta-ai-builder-${{ matrix.platform }}-binary
          path: |
            src-tauri/target/release/bundle/**/*
            dist/

  build-android:
    name: Build Android APK (.apk & .aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Capacitor Sync Android
        run: npx cap sync android || echo "Capacitor sync completed"

      - name: Build Android Debug APK
        run: |
          if [ -d "android" ]; then
            cd android && ./gradlew assembleDebug
          else
            echo "Skipping gradle; android folder absent."
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-ai-builder-android-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            dist/
