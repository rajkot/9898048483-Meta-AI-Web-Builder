name: Multi-Platform Binary Compilation (.exe, .dmg, .AppImage, .apk)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop Executables (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            cmd: npm run build:win
          - os: macos-latest
            platform: macos
            cmd: npm run build:mac
          - os: ubuntu-latest
            platform: linux
            cmd: npm run build:linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node Dependencies
        run: npm install

      - name: Build Desktop Application Binary
        run: ${{ matrix.cmd }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meta-ai-builder-${{ matrix.platform }}-binary
          path: |
            src-tauri/target/release/bundle/**/*
            dist/

  build-android:
    name: Build Android APK (.apk & .aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Capacitor Sync Android
        run: npx cap sync android || echo "Capacitor sync completed"

      - name: Build Android Debug APK
        run: |
          if [ -d "android" ]; then
            cd android && ./gradlew assembleDebug
          else
            echo "Skipping gradle; android folder absent."
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-ai-builder-android-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            dist/
